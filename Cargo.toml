[package]
name = "cxsfm"
version = "0.1.0"
edition = "2024"
authors = ["vabyz971"]
description = "CarX Street Framework Mod - Open-source modding framework for CarX Street"
license = "MIT"
repository = "https://github.com/vabyz971/cxsfm"
keywords = ["carx", "modding", "injection", "egui", "game-mod"]
categories = ["game-development", "rendering", "multiplatform"]

[lib]
crate-type = ["cdylib"]

[dependencies]
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
# Vulkan overlay rendering (Linux layer path only in practice, but the
# crates are pure Rust + ash with no system deps, so they stay
# unconditional): ash for GPU calls through our layer-resolved function
# pointers, egui-ash-renderer 0.13 (egui 0.36 line) for the UI
# pipeline/shaders/fonts.
ash = { version = "0.38", default-features = false, features = ["std"] }
egui-ash-renderer = { version = "0.13", default-features = false }
bitflags = "2.9"
glam = { version = "0.29", features = ["serde"] }
ctor = "0.2"
libc = "0.2"
# x86_64 instruction decoding for the Vulkan inline hook (prologoue
# boundary analysis — never split an instruction when patching).
# Pure Rust, no C toolchain needed.
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info"] }

[target.'cfg(windows)'.dependencies]
# Win32 base + threading/loader (core) + windowing for the DXGI scaffold
# (src/render/dxgi.rs uses GetDesktopWindow; DirectX types below are
# hand-declared because windows-sys 0.59 ships no Dxgi/D3D11 bindings).
windows-sys = { version = "0.59", features = ["Win32", "Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }