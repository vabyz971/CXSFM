[package]
name = "cxsfm"
description = "CarX Street Framework Mod - Open-source modding framework for CarX Street"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["carx", "modding", "injection", "egui", "game-mod"]
categories = ["game-development", "rendering", "multiplatform"]

# The library loaded in game (implicit Vulkan layer): `libcxsfm.so`.
[lib]
crate-type = ["cdylib"]

[dependencies]
cxsfm-api.workspace = true
cxsfm-sys.workspace = true
cxsfm-input.workspace = true
cxsfm-ui.workspace = true
cxsfm-mods.workspace = true
egui.workspace = true
egui_material_icons.workspace = true
ash.workspace = true
egui-ash-renderer.workspace = true
bitflags.workspace = true
ctor.workspace = true
libc.workspace = true
iced-x86.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc.workspace = true

[dev-dependencies]
serde.workspace = true

[lints]
workspace = true
